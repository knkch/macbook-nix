    2: parrun ${video-player} --no-video --force-window=yes '${hover-video-url}'
  'p':
    2: parrun ${video-player} --pane '${hover-video-url}'
  'A':
    1: parrun ${video-player} --no-video --force-window=yes --loop --shuffle '${hover-channel-url}/videos'
  'P':
    1: parrun ${video-player} --no-video --force-window=yes --loop --shuffle '${hover-channel-url}/videos'
library:
  'A':
    1: parrun ${video-player} --no-video --force-window=yes --loop --shuffle '${hover-url}'
  'a':
    2: parrun ${video-player} --no-video --force-window=yes '${hover-url}'
  'p':
    2: parrun ${video-player} --pane '${hover-url}'
