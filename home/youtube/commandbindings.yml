# youtube-tui のショートカットキー（0.9.4 の既定がもと）。home/packages.nix の activation で ~/.config/youtube-tui/commandbindings.yml に書き込む。
# 既定は mpv を直接呼ぶが、mpv が YouTube を直接読むと 403 になるので ${video-player}（ytplay）に置き換えた。
# 数字は修飾キー: 1 = Shift、2 = Ctrl。一覧の上で Ctrl+P = 動画をターミナルの中で再生（cmux なら下に開くペイン。q で閉じる）、Ctrl+A = 音声だけ、Shift+A = 音声だけ・シャッフル・ループ。
# 組み込みの mpv を操作するキー（space・Ctrl+← → など）は、ytplay の mpv には届かないので外した（操作は mpv のウィンドウで）
global:
  'f':
    2: run ${browser} '${url}'
  'c':
    2: cp ${url}
  'y':
    0: cp ${url}
search:
  'p':
    2: parrun ${video-player} --pane '${hover-url}'
  'A':
    1: parrun ${video-player} --no-video --force-window=yes --loop --shuffle '${hover-url}'
  'a':
    2: parrun ${video-player} --no-video --force-window=yes '${hover-url}'
popular:
  'a':
    2: parrun ${video-player} --no-video --force-window=yes '${hover-url}'
  'A':
    1: parrun ${video-player} --no-video --force-window=yes --loop --shuffle '${hover-url}'
  'p':
    2: parrun ${video-player} --pane '${hover-url}'
trending:
  'p':
    2: parrun ${video-player} --pane '${hover-url}'
  'A':
    1: parrun ${video-player} --no-video --force-window=yes --loop --shuffle '${hover-url}'
  'a':
    2: parrun ${video-player} --no-video --force-window=yes '${hover-url}'
video: {}
playlist:
  'a':
    2: parrun ${video-player} --no-video --force-window=yes '${hover-url}'
  'p':
    2: parrun ${video-player} --pane '${hover-url}'
  'A':
    1: parrun ${video-player} --no-video --force-window=yes --loop --shuffle '${hover-url}'
channel_main: {}
